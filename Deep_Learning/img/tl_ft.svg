<svg xmlns="http://www.w3.org/2000/svg" width="860" height="320" viewBox="0 0 860 320">
  <style>
    .title { font: 700 16px 'Segoe UI', sans-serif; fill: #007ACC; }
    .label { font: 600 13px 'Segoe UI', sans-serif; fill: #1a1a1a; }
    .small { font: 12px 'Segoe UI', sans-serif; fill: #333; }
    .muted { font: 11px 'Segoe UI', sans-serif; fill: #555; }
  </style>

  <!-- Transfer Learning panel -->
  <rect x="20" y="20" width="390" height="280" rx="10" fill="#F7FBFE" stroke="#007ACC" stroke-width="2"/>
  <text x="215" y="48" text-anchor="middle" class="title">Transfer Learning (feature extraction)</text>

  <rect x="50" y="70" width="100" height="56" rx="6" fill="#BFDFF5" stroke="#007ACC"/>
  <text x="100" y="95" text-anchor="middle" class="label">Bloques</text>
  <text x="100" y="112" text-anchor="middle" class="small">bajos</text>

  <rect x="165" y="70" width="100" height="56" rx="6" fill="#BFDFF5" stroke="#007ACC"/>
  <text x="215" y="95" text-anchor="middle" class="label">Bloques</text>
  <text x="215" y="112" text-anchor="middle" class="small">medios</text>

  <rect x="280" y="70" width="100" height="56" rx="6" fill="#BFDFF5" stroke="#007ACC"/>
  <text x="330" y="95" text-anchor="middle" class="label">Bloques</text>
  <text x="330" y="112" text-anchor="middle" class="small">altos</text>

  <rect x="50" y="145" width="330" height="36" rx="6" fill="#E8F5E9" stroke="#2E7D32"/>
  <text x="215" y="168" text-anchor="middle" class="label">Cabeza nueva (entrenable)</text>

  <text x="215" y="210" text-anchor="middle" class="muted">Base preentrenada CONGELADA</text>
  <text x="215" y="232" text-anchor="middle" class="muted">Solo se aprende el clasificador</text>
  <text x="215" y="268" text-anchor="middle" class="small">�til con pocos datos / dominio similar</text>

  <!-- Fine-Tuning panel -->
  <rect x="450" y="20" width="390" height="280" rx="10" fill="#FFFBF0" stroke="#FECB05" stroke-width="2"/>
  <text x="645" y="48" text-anchor="middle" class="title">Fine-Tuning (parcial)</text>

  <rect x="480" y="70" width="100" height="56" rx="6" fill="#BFDFF5" stroke="#007ACC"/>
  <text x="530" y="95" text-anchor="middle" class="label">Bloques</text>
  <text x="530" y="112" text-anchor="middle" class="small">bajos</text>
  <text x="530" y="148" text-anchor="middle" class="muted">congelados</text>

  <rect x="595" y="70" width="100" height="56" rx="6" fill="#FFE082" stroke="#F9A825"/>
  <text x="645" y="95" text-anchor="middle" class="label">Bloques</text>
  <text x="645" y="112" text-anchor="middle" class="small">medios</text>
  <text x="645" y="148" text-anchor="middle" class="muted">opcionales</text>

  <rect x="710" y="70" width="100" height="56" rx="6" fill="#FFECB3" stroke="#F9A825"/>
  <text x="760" y="95" text-anchor="middle" class="label">Bloques</text>
  <text x="760" y="112" text-anchor="middle" class="small">altos</text>
  <text x="760" y="148" text-anchor="middle" class="muted">entrenables</text>

  <rect x="480" y="170" width="330" height="36" rx="6" fill="#E8F5E9" stroke="#2E7D32"/>
  <text x="645" y="193" text-anchor="middle" class="label">Cabeza + capas altas (entrenables)</text>

  <text x="645" y="232" text-anchor="middle" class="muted">LR baja para no olvidar ImageNet</text>
  <text x="645" y="268" text-anchor="middle" class="small">Mejor tras entrenar primero la cabeza</text>
</svg>
