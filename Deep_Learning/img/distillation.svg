<svg xmlns="http://www.w3.org/2000/svg" width="920" height="260" viewBox="0 0 920 260">
  <style>
    .title { font: 700 15px 'Segoe UI', sans-serif; fill: #007ACC; }
    .label { font: 600 13px 'Segoe UI', sans-serif; fill: #1a1a1a; }
    .small { font: 12px 'Segoe UI', sans-serif; fill: #333; }
    .muted { font: 11px 'Segoe UI', sans-serif; fill: #555; }
  </style>

  <rect x="16" y="16" width="888" height="228" rx="12" fill="#F7FBFE" stroke="#007ACC" stroke-width="2"/>
  <text x="460" y="42" text-anchor="middle" class="title">Destilación de conocimiento</text>

  <rect x="40" y="70" width="200" height="100" rx="8" fill="#BBDEFB" stroke="#007ACC"/>
  <text x="140" y="108" text-anchor="middle" class="label">Profesor</text>
  <text x="140" y="130" text-anchor="middle" class="small">red grande, ya entrenada</text>
  <text x="140" y="150" text-anchor="middle" class="muted">logits z</text>

  <rect x="300" y="78" width="200" height="84" rx="8" fill="#FFECB3" stroke="#F9A825"/>
  <text x="400" y="112" text-anchor="middle" class="label">softmax(z / T)</text>
  <text x="400" y="134" text-anchor="middle" class="small">etiquetas suaves</text>

  <rect x="560" y="70" width="200" height="100" rx="8" fill="#C8E6C9" stroke="#2E7D32"/>
  <text x="660" y="108" text-anchor="middle" class="label">Estudiante</text>
  <text x="660" y="130" text-anchor="middle" class="small">red más pequeña</text>
  <text x="660" y="150" text-anchor="middle" class="muted">imita p_prof y la etiqueta</text>

  <line x1="240" y1="120" x2="300" y2="120" stroke="#007ACC" stroke-width="2"/>
  <line x1="500" y1="120" x2="560" y2="120" stroke="#F9A825" stroke-width="2"/>

  <rect x="780" y="88" width="100" height="64" rx="8" fill="#E8F5E9" stroke="#2E7D32"/>
  <text x="830" y="116" text-anchor="middle" class="label">y dura</text>
  <text x="830" y="136" text-anchor="middle" class="small">CE</text>
  <line x1="760" y1="120" x2="780" y2="120" stroke="#2E7D32" stroke-width="2"/>

  <text x="460" y="210" text-anchor="middle" class="muted">L = ± CE(y, p_est) + (1  ±) T² KL(p_prof^(T) % p_est^(T))</text>
  <text x="460" y="230" text-anchor="middle" class="muted">T &gt; 1 suaviza; T² restaura la escala de los gradientes (Hinton et al., 2015)</text>
</svg>
