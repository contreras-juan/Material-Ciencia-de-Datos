<svg xmlns="http://www.w3.org/2000/svg" width="780" height="300" viewBox="0 0 780 300">
  <style>
    .title { font: 700 15px 'Segoe UI', sans-serif; fill: #007ACC; }
    .label { font: 600 12px 'Segoe UI', sans-serif; fill: #1a1a1a; }
    .small { font: 11px 'Segoe UI', sans-serif; fill: #333; }
    .muted { font: 11px 'Segoe UI', sans-serif; fill: #555; }
  </style>

  <rect x="10" y="10" width="760" height="280" rx="12" fill="#F7FBFE" stroke="#007ACC" stroke-width="2"/>
  <text x="390" y="38" text-anchor="middle" class="title">ConvLSTM: LSTM + convoluciones espaciales</text>

  <!-- Sequence of frames -->
  <text x="120" y="70" text-anchor="middle" class="label">Entrada: secuencia de mapas</text>
  <rect x="40" y="85" width="50" height="50" rx="4" fill="#BFDFF5" stroke="#007ACC"/>
  <circle cx="58" cy="110" r="8" fill="#007ACC"/>
  <text x="65" y="155" text-anchor="middle" class="small">t2</text>

  <rect x="105" y="85" width="50" height="50" rx="4" fill="#BFDFF5" stroke="#007ACC"/>
  <circle cx="130" cy="108" r="8" fill="#007ACC"/>
  <text x="130" y="155" text-anchor="middle" class="small">t1</text>

  <rect x="170" y="85" width="50" height="50" rx="4" fill="#BFDFF5" stroke="#007ACC"/>
  <circle cx="198" cy="112" r="8" fill="#007ACC"/>
  <text x="195" y="155" text-anchor="middle" class="small">t</text>

  <text x="250" y="115" class="label">’</text>

  <!-- ConvLSTM block -->
  <rect x="280" y="70" width="220" height="100" rx="10" fill="#FFF8E1" stroke="#FECB05" stroke-width="2"/>
  <text x="390" y="100" text-anchor="middle" class="label">ConvLSTM</text>
  <text x="390" y="120" text-anchor="middle" class="small">Puertas LSTM con *</text>
  <text x="390" y="138" text-anchor="middle" class="small">(convolución) en lugar de ·</text>
  <text x="390" y="156" text-anchor="middle" class="muted">preserva estructura espacial</text>

  <text x="520" y="115" class="label">’</text>

  <!-- Output -->
  <rect x="550" y="85" width="50" height="50" rx="4" fill="#E8F5E9" stroke="#2E7D32"/>
  <circle cx="585" cy="115" r="8" fill="#2E7D32"/>
  <text x="575" y="155" text-anchor="middle" class="small">t+1</text>
  <text x="660" y="105" text-anchor="middle" class="label">Predicción</text>
  <text x="660" y="125" text-anchor="middle" class="small">siguiente mapa</text>

  <text x="390" y="210" text-anchor="middle" class="label">Forma típica en Keras (ConvLSTM2D)</text>
  <text x="390" y="235" text-anchor="middle" class="small">(batch, timesteps, altura, ancho, canales)</text>
  <text x="390" y="260" text-anchor="middle" class="muted">Aplicaciones: precipitación, video, radar, frames médicos</text>
</svg>
